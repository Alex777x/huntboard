<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HuntBoard Quick Saver</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --border: #334155;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      color: #818cf8;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    .status {
      margin-top: 8px;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">
      <span>🎯</span> HuntBoard Saver
    </div>
    <span style="font-size: 10px; color: var(--text-muted)">v1.0</span>
  </div>

  <form id="jobForm">
    <div class="field">
      <label for="jobTitle">Job Title *</label>
      <input type="text" id="jobTitle" required />
    </div>

    <div class="field">
      <label for="companyName">Company *</label>
      <input type="text" id="companyName" required />
    </div>

    <div style="display: flex; gap: 8px;">
      <div class="field" style="flex: 1;">
        <label for="stage">Pipeline Stage</label>
        <select id="stage">
          <option value="wishlist">Wishlist</option>
          <option value="applied" selected>Applied</option>
          <option value="phone_screen">Phone Screen</option>
          <option value="interview">Interview</option>
        </select>
      </div>

      <div class="field" style="flex: 1;">
        <label for="salary">Target Salary</label>
        <input type="text" id="salary" placeholder="$140k - $160k" />
      </div>
    </div>

    <div class="field">
      <label for="notes">Notes / URL</label>
      <textarea id="notes" rows="2"></textarea>
    </div>

    <button type="submit" id="saveBtn">
      <span>Save to HuntBoard Kanban</span>
    </button>
  </form>

  <div id="statusMessage" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
